configurations {
  openbisTransport
}

dependencies {
  openbisTransport project(path: ':backend:openbis-transport', configuration: 'openbisTransport')
}

createDockerContext {
  doLast {
    copy {
      from ('.') {
        include 'Dockerfile'
        include 'regctl*'
        include '*.sh'
        include 'play.template'
        include 'play.ps1.template'
        include 'play.bat'
        into '/'
      }

      from configurations.openbisTransport {
        into '/'
      }

      into dockerContextDir
    }
  }
}
createDockerContext.dependsOn configurations.openbisTransport
