<VirtualHost *:8080>
  ServerName rrp-file-server

  DocumentRoot /frontend
  AddType image/x-icon .ico

  ErrorLog /dev/stderr
  CustomLog /dev/stdout combined

  <Directory />
    Options FollowSymLinks
    AllowOverride All
    Allow from all
    Require all granted
  </Directory>

  LogLevel warn
  ServerSignature On

  FallbackResource /index.html

</VirtualHost>
