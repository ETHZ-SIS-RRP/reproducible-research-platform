plugins {
  id 'com.bmuschko.docker-remote-api' version '6.7.0'
}
import com.bmuschko.gradle.docker.tasks.image.*

def dockerContextDir =  "${buildDir}/docker-context"

task createDockerContext(type: Sync) {

  from('.') {
    into '/'
    exclude 'build'
  }

  into dockerContextDir
}

task buildImage(type:Exec, dependsOn: createDockerContext) {
  inputs.dir file(dockerContextDir)
  workingDir dockerContextDir
  outputs.dir new File("${buildDir}/build-image")
  buildx delegate, 'fuse'
}

build.dependsOn buildImage

