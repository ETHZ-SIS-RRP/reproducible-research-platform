apply plugin: 'application'

dependencies {
  api project(':backend:core'),
      project(':backend:openbis-mounting-service'),
      'openBIS:openBIS-API-V3-batteries-included:20.10.5-r1669972959',
      'net.sourceforge.argparse4j:argparse4j:0.9.0',
      'org.slf4j:slf4j-api:1.7.30',
      'org.slf4j:slf4j-simple:1.7.30'
}

configurations {
  runtime {
    canBeResolved = true
  }
  runtime.extendsFrom runtimeOnly
  runtime.extendsFrom api
}

def scripts = [
  'create-dataset': 'ch.ethz.id.sis.rrp.transport.CreateDataSet',
  'download-dataset': 'ch.ethz.id.sis.rrp.transport.DownloadDataSet',
  'download-player-datasets': 'ch.ethz.id.sis.rrp.transport.DownloadPlayerDataSets'
]

scripts.each() { scriptName, className ->
  def t = tasks.create(name: scriptName+'StartScript', type: CreateStartScripts) {
    mainClass = className
    applicationName = scriptName
    outputDir = new File(project.buildDir, 'scripts')
    classpath = jar.outputs.files + project.configurations.runtime
  }

  application {
    applicationDistribution.into("bin") {
      from(t)
      fileMode = 0755
      duplicatesStrategy DuplicatesStrategy.EXCLUDE
    }
  }
}

configurations {
  openbisTransport
}

artifacts {
  openbisTransport(file("${installDist.destinationDir}/..")) { builtBy installDist }
}