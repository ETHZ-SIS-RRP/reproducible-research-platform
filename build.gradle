wrapper {
  gradleVersion = '8.8'
}

buildscript {
  repositories {
    gradlePluginPortal()
  }
  dependencies {
    classpath 'com.github.maiflai:gradle-scalatest:0.32',
              'com.bmuschko:gradle-docker-plugin:9.4.0'
  }
}

configure(subprojects) {
  apply plugin:'base'

  repositories {
    mavenCentral()
    flatDir { dirs new File(rootProject.rootDir, 'backend').absolutePath + "/libs" }
  }

  def props = new Properties()
  rootProject.file("versions.txt").withInputStream { props.load(it) }
  ext.rrpVersion = props.getProperty("rrp-version")
  ext.repo2dockerVersion = props.getProperty("repo2docker-version")

  new ByteArrayOutputStream().withStream { os ->
    exec {
      commandLine 'git', 'rev-parse', 'HEAD'
      standardOutput = os
    }

    ext.gitCommitHash = os.toString().trim().substring(0, 7)
  }

  if (!project.hasProperty("registry")) {
    ext.registry = ""
  }

  ext.reg = registry == "local" ? "" : registry + "/"
}

def getCpuArchitecture() {
  return System.getProperty("os.arch") == "aarch64" ? "arm64" : "amd64"
}

println("Building for ${getCpuArchitecture()}")

configure(subprojects.findAll { it.file("Dockerfile").exists() }) {
  apply plugin: 'com.bmuschko.docker-remote-api'
  ext.dockerContextDir =  "${buildDir}/docker-context"
  def imageNameTagged = "${reg}${name}:${gitCommitHash}"
  def imageNameLatest = "${reg}${name}:latest"

  task createDockerContext {
    inputs.dir '.'
    outputs.dir dockerContextDir
    doLast {
      copy {
        from '.'
        into dockerContextDir
        exclude 'build'
      }
    }
  }

  task buildImage(type: com.bmuschko.gradle.docker.tasks.image.DockerBuildImage, dependsOn: createDockerContext) {
    inputDir = file(dockerContextDir)
    images.add(imageNameTagged)
    images.add(imageNameLatest)
    cacheFrom.add(imageNameTagged)
    cacheFrom.add(imageNameLatest)
    buildArgs.put("TARGETARCH", getCpuArchitecture())
  }

  task pushImage(type: com.bmuschko.gradle.docker.tasks.image.DockerPushImage, dependsOn: buildImage) {
    images.add(imageNameTagged)
    images.add(imageNameLatest)
  }

  configurations {
    image
  }

  artifacts {
    image buildImage.imageIdFile
  }

  if (registry == "local")
    build.dependsOn buildImage
  else
    build.dependsOn pushImage
}


configure(subprojects.findAll { it.buildFile.path.contains('/backend/') }) {
  apply plugin: 'java-library'
  apply plugin: 'scala'
  apply plugin: 'com.github.maiflai.scalatest'

  def scalaOptions = [
      "-feature",
      "-encoding", "UTF-8",
      "-language:existentials",
      "-language:implicitConversions",
      "-language:higherKinds",
      "-language:postfixOps"
  ]

  compileScala {
    scalaCompileOptions.additionalParameters = scalaOptions
  }

  compileTestScala {
    scalaCompileOptions.additionalParameters = scalaOptions
  }

  dependencies {
    testImplementation 'org.scalatest:scalatest_3:3.2.12'
    testRuntimeOnly 'com.vladsch.flexmark:flexmark-all:0.64.0'
  }

  java {
    toolchain {
      languageVersion.set(JavaLanguageVersion.of(17))
    }
  }
}
